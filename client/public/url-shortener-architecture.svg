<svg width="700" height="340" viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="340" fill="#0B0B0D"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3A3A40" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== LAYER 1: boxes, drawn first ===== -->

  <rect x="20" y="115" width="140" height="70" rx="8" fill="#17171A" stroke="#26262A"/>
  <text x="90" y="145" text-anchor="middle" fill="#F5F5F3" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Dashboard</text>
  <text x="90" y="162" text-anchor="middle" fill="#A6A6AC" font-family="'JetBrains Mono', monospace" font-size="9">React</text>

  <rect x="210" y="15" width="190" height="95" rx="8" fill="#17171A" stroke="#FF6B45" stroke-width="1.5"/>
  <text x="305" y="38" text-anchor="middle" fill="#FF6B45" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">POST /api/shorten</text>
  <text x="305" y="58" text-anchor="middle" fill="#A6A6AC" font-family="'JetBrains Mono', monospace" font-size="9">rate limit check</text>
  <text x="305" y="75" text-anchor="middle" fill="#A6A6AC" font-family="'JetBrains Mono', monospace" font-size="9">atomic ID (base62)</text>

  <rect x="210" y="140" width="190" height="95" rx="8" fill="#17171A" stroke="#7C6FF0" stroke-width="1.5"/>
  <text x="305" y="160" text-anchor="middle" fill="#7C6FF0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GET /:code</text>
  <text x="305" y="178" text-anchor="middle" fill="#A6A6AC" font-family="'JetBrains Mono', monospace" font-size="9">cache check</text>
  <text x="305" y="195" text-anchor="middle" fill="#A6A6AC" font-family="'JetBrains Mono', monospace" font-size="9">302 redirect</text>
  <text x="305" y="212" text-anchor="middle" fill="#A6A6AC" font-family="'JetBrains Mono', monospace" font-size="9">queue click event</text>

  <rect x="450" y="15" width="140" height="50" rx="8" fill="#17171A" stroke="#26262A"/>
  <text x="520" y="44" text-anchor="middle" fill="#4AD3C9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Redis: counter</text>

  <rect x="450" y="80" width="140" height="50" rx="8" fill="#17171A" stroke="#26262A"/>
  <text x="520" y="109" text-anchor="middle" fill="#4AD3C9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Redis: rate limit</text>

  <rect x="450" y="140" width="140" height="50" rx="8" fill="#17171A" stroke="#26262A"/>
  <text x="520" y="169" text-anchor="middle" fill="#4AD3C9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Redis: cache</text>

  <rect x="450" y="200" width="140" height="50" rx="8" fill="#17171A" stroke="#26262A"/>
  <text x="520" y="229" text-anchor="middle" fill="#4AD3C9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Redis: click queue</text>

  <rect x="210" y="265" width="190" height="50" rx="8" fill="#17171A" stroke="#26262A"/>
  <text x="305" y="294" text-anchor="middle" fill="#7C6FF0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">MongoDB (links)</text>

  <!-- ===== LAYER 2: strictly orthogonal lines, drawn on top ===== -->

  <!-- Dashboard -> POST -->
  <path d="M160 135 L185 135 L185 55 L208 55" fill="none" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Dashboard -> GET -->
  <path d="M160 165 L185 165 L185 185 L208 185" fill="none" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- POST -> counter (same height, straight) -->
  <path d="M400 40 L448 40" fill="none" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle r="3" fill="#FF6B45"><animateMotion dur="1.6s" repeatCount="indefinite" path="M400 40 L448 40"/></circle>

  <!-- POST -> rate limit -->
  <path d="M400 80 L425 80 L425 105 L448 105" fill="none" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle r="3" fill="#FF6B45"><animateMotion dur="1.9s" repeatCount="indefinite" path="M400 80 L425 80 L425 105 L448 105" begin="0.4s"/></circle>

  <!-- POST -> MongoDB, routed around the left side so it never crosses GET -->
  <path d="M215 110 L182 110 L182 290 L208 290" fill="none" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle r="3" fill="#FF6B45"><animateMotion dur="2.4s" repeatCount="indefinite" path="M215 110 L182 110 L182 290 L208 290" begin="0.8s"/></circle>

  <!-- GET -> cache (same height, straight) -->
  <path d="M400 165 L448 165" fill="none" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle r="3" fill="#7C6FF0"><animateMotion dur="1.5s" repeatCount="indefinite" path="M400 165 L448 165"/></circle>

  <!-- GET -> click queue -->
  <path d="M400 205 L425 205 L425 225 L448 225" fill="none" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle r="3" fill="#7C6FF0"><animateMotion dur="1.8s" repeatCount="indefinite" path="M400 205 L425 205 L425 225 L448 225" begin="0.5s"/></circle>

  <!-- GET -> MongoDB (straight down, nothing in the way) -->
  <path d="M305 235 L305 263" fill="none" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle r="3" fill="#7C6FF0"><animateMotion dur="1.3s" repeatCount="indefinite" path="M305 235 L305 263" begin="0.9s"/></circle>

  <text x="520" y="260" text-anchor="middle" fill="#6B6B70" font-family="'JetBrains Mono', monospace" font-size="8">(flushed to Mongo every 3s)</text>
</svg>
