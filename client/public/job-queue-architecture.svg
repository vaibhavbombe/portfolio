<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="300" fill="#0B0B0D"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3A3A40" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== LAYER 1: all boxes, drawn first ===== -->

  <rect x="30" y="110" width="150" height="60" rx="8" fill="#17171A" stroke="#26262A"/>
  <text x="105" y="135" text-anchor="middle" fill="#F5F5F3" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">Dashboard</text>
  <text x="105" y="152" text-anchor="middle" fill="#A6A6AC" font-family="'JetBrains Mono', monospace" font-size="10">React + Chart.js</text>

  <rect x="270" y="80" width="220" height="140" rx="8" fill="#17171A" stroke="#FF6B45" stroke-width="1.5"/>
  <text x="380" y="105" text-anchor="middle" fill="#FF6B45" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">server.js (one process)</text>

  <rect x="290" y="122" width="75" height="40" rx="6" fill="#0B0B0D" stroke="#26262A"/>
  <text x="327" y="146" text-anchor="middle" fill="#F5F5F3" font-family="'JetBrains Mono', monospace" font-size="11">Express</text>

  <rect x="390" y="122" width="75" height="40" rx="6" fill="#0B0B0D" stroke="#26262A"/>
  <text x="427" y="146" text-anchor="middle" fill="#F5F5F3" font-family="'JetBrains Mono', monospace" font-size="11">Worker</text>

  <text x="380" y="196" text-anchor="middle" fill="#A6A6AC" font-family="'JetBrains Mono', monospace" font-size="9">retries + backoff</text>

  <rect x="250" y="255" width="150" height="40" rx="8" fill="#17171A" stroke="#26262A"/>
  <text x="325" y="279" text-anchor="middle" fill="#4AD3C9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Redis (queue)</text>

  <rect x="410" y="255" width="150" height="40" rx="8" fill="#17171A" stroke="#26262A"/>
  <text x="485" y="279" text-anchor="middle" fill="#7C6FF0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">MongoDB (history)</text>

  <rect x="560" y="95" width="120" height="50" rx="8" fill="#17171A" stroke="#26262A"/>
  <text x="620" y="118" text-anchor="middle" fill="#F5F5F3" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Bull Board</text>
  <text x="620" y="134" text-anchor="middle" fill="#A6A6AC" font-family="'JetBrains Mono', monospace" font-size="9">/admin/queues</text>

  <!-- ===== LAYER 2: all connecting lines, labels, and dots, drawn on top ===== -->

  <path d="M180 140 L268 140" fill="none" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="224" y="108" text-anchor="middle" fill="#6B6B70" font-family="'JetBrains Mono', monospace" font-size="9">REST +</text>
  <text x="224" y="119" text-anchor="middle" fill="#6B6B70" font-family="'JetBrains Mono', monospace" font-size="9">Socket.io</text>
  <circle r="3.5" fill="#FF6B45">
    <animateMotion dur="2s" repeatCount="indefinite" path="M180 140 L268 140"/>
  </circle>

  <path d="M327 225 L325 253" fill="none" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle r="3.5" fill="#4AD3C9">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M327 225 L325 253" begin="0.3s"/>
  </circle>

  <path d="M427 225 L485 253" fill="none" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle r="3.5" fill="#7C6FF0">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M427 225 L485 253" begin="0.8s"/>
  </circle>

  <path d="M490 120 L558 120" fill="none" stroke="#3A3A40" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle r="3.5" fill="#F5F5F3">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M490 120 L558 120" begin="1.1s"/>
  </circle>
</svg>
